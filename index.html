<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#16241C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Le Mie Piante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16241C;
    --surface: #1E3328;
    --surface-2: #24402F;
    --text: #F1EDE1;
    --text-dim: #A9B8AC;
    --text-faint: #6E8073;
    --accent-ok: #8FBF6F;
    --accent-soon: #E3B23C;
    --accent-overdue: #E2604A;
    --accent-water: #6FAAC4;
    --border: rgba(241,237,225,0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overscroll-behavior-y: contain;
  }
  body {
    padding-bottom: 100px;
  }
  .topbar {
    padding: 28px 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    position: sticky;
    top: 0;
    background: linear-gradient(var(--bg) 80%, transparent);
    z-index: 5;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-water);
  }
  .topbar-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .btn-settings {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 34px; height: 34px;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 2px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    margin: 2px 0 0;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 13.5px;
    margin-top: 4px;
  }
  .list {
    padding: 8px 16px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .ring-wrap {
    position: relative;
    width: 52px;
    height: 52px;
    flex-shrink: 0;
  }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: var(--border); stroke-width: 5; }
  .ring-fill { fill: none; stroke-width: 5; stroke-linecap: round; transition: stroke-dasharray 0.4s ease; }
  .avatar-inner {
    position: absolute; inset: 6px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    background-size: cover;
    background-position: center;
  }
  .badge {
    position: absolute;
    bottom: -3px; right: -3px;
    min-width: 18px; height: 18px;
    padding: 0 3px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    color: #0E1F1A;
    border: 2px solid var(--surface);
  }
  .chips {
    display: flex;
    gap: 8px;
    padding: 10px 16px 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.active {
    background: var(--accent-water);
    color: #0E1F1A;
    border-color: var(--accent-water);
    font-weight: 600;
  }
  .card-cat {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.03em;
    color: var(--accent-water);
    text-transform: uppercase;
    margin-top: 2px;
  }
  .field select {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    appearance: none;
    -webkit-appearance: none;
  }
  .field select:focus { outline: 2px solid var(--accent-water); }
  .photo-picker {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .photo-preview {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: var(--surface-2);
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    color: var(--text-faint);
    border: 1px solid var(--border);
  }
  .photo-btns { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .btn-photo {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    text-align: center;
  }
  .btn-photo.remove { color: var(--accent-overdue); }
  .card-body { flex: 1; min-width: 0; }
  .card-name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 17px;
    margin: 0 0 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-status {
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .card-status.overdue { color: var(--accent-overdue); font-weight: 600; }
  .card-status.today { color: var(--accent-soon); font-weight: 600; }
  .card-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .btn-water {
    background: var(--accent-water);
    color: #0E1F1A;
    border: none;
    border-radius: 12px;
    padding: 9px 12px;
    font-size: 12.5px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .btn-water:active { transform: scale(0.96); }
  .btn-icon {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 18px;
    width: 30px; height: 30px;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-icon:active { background: var(--surface-2); }
  .empty {
    margin: 60px 24px;
    text-align: center;
    color: var(--text-dim);
  }
  .empty .glyph { font-size: 34px; margin-bottom: 10px; }
  .empty p { font-size: 14px; line-height: 1.5; }
  .toast-notif {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 30;
    padding: 14px 16px;
    padding-top: calc(14px + env(safe-area-inset-top));
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    animation: slideDown 0.35s ease;
  }
  @keyframes slideDown {
    from { transform: translateY(-100%); }
    to { transform: translateY(0); }
  }
  .toast-notif .bell {
    font-size: 20px;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .toast-notif .toast-body { flex: 1; }
  .toast-notif .toast-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--accent-overdue);
    margin: 0 0 2px;
  }
  .toast-notif .toast-detail {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
    line-height: 1.4;
  }
  .toast-notif .toast-close {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0 2px;
  }
  .fab {
    position: fixed;
    right: 20px;
    bottom: 24px;
    width: 58px; height: 58px;
    border-radius: 50%;
    background: var(--accent-ok);
    color: #0E1F1A;
    border: none;
    font-size: 28px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    cursor: pointer;
    z-index: 10;
  }
  .fab:active { transform: scale(0.95); }
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: flex-end;
    z-index: 20;
  }
  .sheet-backdrop.open { display: flex; }
  .sheet {
    background: var(--surface);
    width: 100%;
    border-radius: 22px 22px 0 0;
    padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
  }
  .sheet h2 {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    margin: 0 0 16px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em;
  }
  .field input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
  }
  .field input:focus { outline: 2px solid var(--accent-water); }
  .sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 13px;
    font-size: 14.5px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent-ok); color: #0E1F1A; }
  .btn-secondary { background: var(--surface-2); color: var(--text); }
  .btn-danger { background: none; color: var(--accent-overdue); border: 1px solid var(--accent-overdue); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div>
      <div class="eyebrow">annaffiatura</div>
      <h1>Le Mie Piante</h1>
      <div class="subtitle" id="subtitle">Caricamento...</div>
    </div>
    <button class="btn-settings" id="btnSettings" aria-label="Impostazioni">⚙</button>
  </div>
</div>

<div class="sheet-backdrop" id="settingsBackdrop">
  <div class="sheet">
    <h2>Dati e backup</h2>
    <p style="font-size:13px;color:var(--text-dim);line-height:1.5;margin-top:-6px;">
      Esporta un file di backup con tutte le tue piante, oppure importalo per ripristinarlo o trasferirlo su un altro dispositivo/versione dell'app.
    </p>
    <div class="sheet-actions">
      <button class="btn btn-secondary" id="btnExport">Esporta dati</button>
      <button class="btn btn-primary" id="btnImportTrigger">Importa dati</button>
    </div>
    <input type="file" id="fImport" accept="application/json" style="display:none;">
    <div class="sheet-actions">
      <button class="btn btn-secondary" id="btnCloseSettings">Chiudi</button>
    </div>
  </div>
</div>

<div class="toast-notif" id="toastNotif" style="display:none;">
  <div class="bell">🔔</div>
  <div class="toast-body">
    <p class="toast-title" id="toastTitle"></p>
    <p class="toast-detail" id="toastDetail"></p>
  </div>
  <button class="toast-close" id="toastClose" aria-label="Chiudi">✕</button>
</div>

<div class="chips" id="chips"></div>

<div class="list" id="list"></div>
<div class="empty" id="empty" style="display:none;">
  <div class="glyph">🪴</div>
  <p>Nessuna pianta ancora.<br>Tocca + per aggiungere la prima.</p>
</div>

<button class="fab" id="fabAdd" aria-label="Aggiungi pianta">+</button>

<div class="sheet-backdrop" id="backdrop">
  <div class="sheet">
    <h2 id="sheetTitle">Nuova pianta</h2>
    <div class="field">
      <label for="fName">Nome</label>
      <input type="text" id="fName" placeholder="es. Monstera del salotto" maxlength="40">
    </div>
    <div class="field">
      <label for="fFreq">Ogni quanti giorni annaffiarla</label>
      <input type="number" id="fFreq" min="1" max="90" value="7">
    </div>
    <div class="field">
      <label for="fLast">Ultima annaffiatura</label>
      <input type="date" id="fLast">
    </div>
    <div class="field">
      <label for="fCategory">Categoria</label>
      <select id="fCategory"></select>
    </div>
    <div class="field" id="newCategoryField" style="display:none;">
      <label for="fCategoryNew">Nome nuova categoria</label>
      <input type="text" id="fCategoryNew" placeholder="es. Terrazzo" maxlength="24">
    </div>
    <div class="field">
      <label>Foto</label>
      <div class="photo-picker">
        <div class="photo-preview" id="photoPreview">🌱</div>
        <div class="photo-btns">
          <button type="button" class="btn-photo" id="btnPickPhoto">Scegli / scatta foto</button>
          <button type="button" class="btn-photo remove" id="btnRemovePhoto" style="display:none;">Rimuovi foto</button>
        </div>
        <input type="file" id="fPhoto" accept="image/*" capture="environment" style="display:none;">
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" id="btnCancel">Annulla</button>
      <button class="btn btn-primary" id="btnSave">Salva</button>
    </div>
    <div class="sheet-actions" id="deleteRow" style="display:none;">
      <button class="btn btn-danger" id="btnDelete">Elimina pianta</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'piante-irrigazione-v1';
const CATEGORY_KEY = 'piante-categorie-v1';
const DEFAULT_CATEGORIES = ['Casa', 'Balcone', 'Giardino'];
let plants = [];
let categories = [];
let editingId = null;
let activeFilter = 'all';
let pendingPhoto = undefined; // undefined = unchanged, null = removed, string = new dataURL

function loadPlants() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    plants = raw ? JSON.parse(raw) : [];
  } catch (e) {
    plants = [];
  }
}
function savePlants() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(plants)); }
  catch (e) {
    alert('Spazio esaurito: prova a usare una foto più leggera o rimuovine qualcuna.');
    console.error('Impossibile salvare', e);
  }
}
function loadCategories() {
  try {
    const raw = localStorage.getItem(CATEGORY_KEY);
    categories = raw ? JSON.parse(raw) : [...DEFAULT_CATEGORIES];
  } catch (e) {
    categories = [...DEFAULT_CATEGORIES];
  }
}
function saveCategories() {
  try { localStorage.setItem(CATEGORY_KEY, JSON.stringify(categories)); }
  catch (e) { console.error('Impossibile salvare categorie', e); }
}
function allCategoriesInUse() {
  const set = new Set(categories);
  plants.forEach(p => { if (p.category) set.add(p.category); });
  return Array.from(set);
}
function todayISO() {
  const d = new Date();
  d.setHours(0,0,0,0);
  return d.toISOString().slice(0,10);
}
function daysBetween(isoStart, isoEnd) {
  const a = new Date(isoStart + 'T00:00:00');
  const b = new Date(isoEnd + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}
function status(plant) {
  const elapsed = daysBetween(plant.lastWatered, todayISO());
  const daysLeft = plant.freq - elapsed;
  const fraction = Math.min(1, Math.max(0, elapsed / plant.freq));
  let level, label;
  if (daysLeft < 0) { level = 'overdue'; label = `In ritardo di ${Math.abs(daysLeft)}g`; }
  else if (daysLeft === 0) { level = 'today'; label = 'Da annaffiare oggi'; }
  else if (daysLeft <= 2) { level = 'soon'; label = `Tra ${daysLeft}g`; }
  else { level = 'ok'; label = `Tra ${daysLeft}g`; }
  return { daysLeft, fraction, level, label };
}
function colorFor(level) {
  return level === 'overdue' ? 'var(--accent-overdue)'
       : level === 'today'  ? 'var(--accent-soon)'
       : level === 'soon'   ? 'var(--accent-soon)'
       : 'var(--accent-ok)';
}
function ringSVG(fraction, level) {
  const r = 20, c = 2 * Math.PI * r;
  const dash = c * fraction;
  return `<svg width="52" height="52" viewBox="0 0 52 52">
    <circle class="ring-track" cx="26" cy="26" r="${r}"></circle>
    <circle class="ring-fill" cx="26" cy="26" r="${r}"
      stroke="${colorFor(level)}"
      stroke-dasharray="${dash} ${c}"></circle>
  </svg>`;
}
function avatarHTML(p, s) {
  const badgeColor = colorFor(s.level);
  const badgeText = s.level === 'overdue' ? '!' : s.daysLeft + 'g';
  const inner = p.photo
    ? `<div class="avatar-inner" style="background-image:url('${p.photo}')"></div>`
    : `<div class="avatar-inner">🌱</div>`;
  return `<div class="ring-wrap">
      ${ringSVG(s.fraction, s.level)}
      ${inner}
      <div class="badge" style="background:${badgeColor}">${badgeText}</div>
    </div>`;
}
function renderChips() {
  const chips = document.getElementById('chips');
  const cats = allCategoriesInUse();
  if (plants.length === 0) { chips.innerHTML = ''; return; }
  const all = [{ name: 'Tutte', key: 'all' }, ...cats.map(c => ({ name: c, key: c }))];
  chips.innerHTML = all.map(c => `
    <button class="chip ${activeFilter === c.key ? 'active' : ''}" data-filter="${escapeHTML(c.key)}">${escapeHTML(c.name)}</button>
  `).join('');
}
function render() {
  loadPlants();
  loadCategories();
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const subtitle = document.getElementById('subtitle');

  renderChips();

  if (plants.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    subtitle.textContent = 'Nessuna pianta';
    return;
  }
  empty.style.display = 'none';

  const visible = activeFilter === 'all'
    ? plants
    : plants.filter(p => (p.category || 'Generale') === activeFilter);

  const enriched = visible.map(p => ({ p, s: status(p) }));
  enriched.sort((a,b) => a.s.daysLeft - b.s.daysLeft);
  const overdueCount = enriched.filter(x => x.s.daysLeft < 0).length;
  subtitle.textContent = overdueCount > 0
    ? `${overdueCount} pianta${overdueCount>1?'e':''} da annaffiare`
    : `${visible.length} piante, tutto a posto`;

  if (enriched.length === 0) {
    list.innerHTML = `<p style="color:var(--text-dim);font-size:13.5px;padding:20px 4px;">Nessuna pianta in questa categoria.</p>`;
    return;
  }

  list.innerHTML = enriched.map(({p, s}) => `
    <div class="card">
      ${avatarHTML(p, s)}
      <div class="card-body">
        <p class="card-name">${escapeHTML(p.name)}</p>
        <p class="card-status ${s.level === 'overdue' ? 'overdue' : s.level === 'today' ? 'today' : ''}">${s.label} · ogni ${p.freq}g</p>
        <span class="card-cat">${escapeHTML(p.category || 'Generale')}</span>
      </div>
      <div class="card-actions">
        <button class="btn-water" data-id="${p.id}" data-action="water">annaffiata</button>
        <button class="btn-icon" data-id="${p.id}" data-action="edit">✎</button>
      </div>
    </div>
  `).join('');
}
document.getElementById('chips').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  activeFilter = chip.dataset.filter;
  render();
});
function escapeHTML(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

document.getElementById('list').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const id = btn.dataset.id;
  if (btn.dataset.action === 'water') {
    const p = plants.find(x => x.id === id);
    if (p) { p.lastWatered = todayISO(); savePlants(); render(); }
  } else if (btn.dataset.action === 'edit') {
    openSheet(id);
  }
});

const backdrop = document.getElementById('backdrop');
const fName = document.getElementById('fName');
const fFreq = document.getElementById('fFreq');
const fLast = document.getElementById('fLast');
const fCategory = document.getElementById('fCategory');
const fCategoryNew = document.getElementById('fCategoryNew');
const newCategoryField = document.getElementById('newCategoryField');
const deleteRow = document.getElementById('deleteRow');
const sheetTitle = document.getElementById('sheetTitle');
const fPhoto = document.getElementById('fPhoto');
const photoPreview = document.getElementById('photoPreview');
const btnPickPhoto = document.getElementById('btnPickPhoto');
const btnRemovePhoto = document.getElementById('btnRemovePhoto');

function populateCategorySelect(selected) {
  loadCategories();
  const cats = allCategoriesInUse();
  fCategory.innerHTML = cats.map(c => `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join('')
    + `<option value="__new__">+ Nuova categoria...</option>`;
  fCategory.value = cats.includes(selected) ? selected : (cats[0] || '__new__');
  newCategoryField.style.display = 'none';
  fCategoryNew.value = '';
}
fCategory.addEventListener('change', () => {
  newCategoryField.style.display = fCategory.value === '__new__' ? 'block' : 'none';
  if (fCategory.value === '__new__') fCategoryNew.focus();
});

function setPhotoPreview(dataUrl) {
  if (dataUrl) {
    photoPreview.style.backgroundImage = `url('${dataUrl}')`;
    photoPreview.textContent = '';
    btnRemovePhoto.style.display = 'block';
  } else {
    photoPreview.style.backgroundImage = '';
    photoPreview.textContent = '🌱';
    btnRemovePhoto.style.display = 'none';
  }
}
btnPickPhoto.addEventListener('click', () => fPhoto.click());
btnRemovePhoto.addEventListener('click', () => {
  pendingPhoto = null;
  setPhotoPreview(null);
});
function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 240;
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height >= width && height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.65));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
fPhoto.addEventListener('change', async () => {
  const file = fPhoto.files[0];
  if (!file) return;
  try {
    const dataUrl = await resizeImage(file);
    pendingPhoto = dataUrl;
    setPhotoPreview(dataUrl);
  } catch (e) {
    console.error('Errore lettura immagine', e);
  }
  fPhoto.value = '';
});

function openSheet(id) {
  editingId = id || null;
  pendingPhoto = undefined;
  if (id) {
    const p = plants.find(x => x.id === id);
    sheetTitle.textContent = 'Modifica pianta';
    fName.value = p.name;
    fFreq.value = p.freq;
    fLast.value = p.lastWatered;
    populateCategorySelect(p.category || 'Generale');
    setPhotoPreview(p.photo || null);
    deleteRow.style.display = 'flex';
  } else {
    sheetTitle.textContent = 'Nuova pianta';
    fName.value = '';
    fFreq.value = 7;
    fLast.value = todayISO();
    populateCategorySelect(activeFilter !== 'all' ? activeFilter : undefined);
    setPhotoPreview(null);
    deleteRow.style.display = 'none';
  }
  backdrop.classList.add('open');
}
function closeSheet() { backdrop.classList.remove('open'); editingId = null; pendingPhoto = undefined; }

document.getElementById('fabAdd').addEventListener('click', () => openSheet(null));
document.getElementById('btnCancel').addEventListener('click', closeSheet);
backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeSheet(); });

document.getElementById('btnSave').addEventListener('click', () => {
  const name = fName.value.trim();
  const freq = Math.max(1, parseInt(fFreq.value, 10) || 7);
  const last = fLast.value || todayISO();
  if (!name) { fName.focus(); return; }

  let category;
  if (fCategory.value === '__new__') {
    category = fCategoryNew.value.trim();
    if (!category) { fCategoryNew.focus(); return; }
    if (!categories.includes(category)) { categories.push(category); saveCategories(); }
  } else {
    category = fCategory.value;
  }

  if (editingId) {
    const p = plants.find(x => x.id === editingId);
    p.name = name; p.freq = freq; p.lastWatered = last; p.category = category;
    if (pendingPhoto !== undefined) p.photo = pendingPhoto;
  } else {
    plants.push({
      id: 'p' + Date.now(), name, freq, lastWatered: last, category,
      photo: pendingPhoto || null
    });
  }
  savePlants();
  closeSheet();
  render();
});

document.getElementById('btnDelete').addEventListener('click', () => {
  if (!editingId) return;
  plants = plants.filter(x => x.id !== editingId);
  savePlants();
  closeSheet();
  render();
});

function checkDueOnOpen() {
  loadPlants();
  const due = plants.filter(p => status(p).daysLeft <= 0);
  const toast = document.getElementById('toastNotif');
  if (due.length === 0) { toast.style.display = 'none'; return; }

  const overdue = due.filter(p => status(p).daysLeft < 0).length;
  const title = due.length === 1
    ? '1 pianta ha sete'
    : `${due.length} piante hanno sete`;
  const names = due.map(p => p.name).join(', ');
  const extra = overdue > 0 ? ' — alcune sono in ritardo' : '';

  document.getElementById('toastTitle').textContent = title;
  document.getElementById('toastDetail').textContent = names + extra;
  toast.style.display = 'flex';
}
document.getElementById('toastClose').addEventListener('click', () => {
  document.getElementById('toastNotif').style.display = 'none';
});

document.getElementById('btnSettings').addEventListener('click', () => {
  document.getElementById('settingsBackdrop').classList.add('open');
});
document.getElementById('btnCloseSettings').addEventListener('click', () => {
  document.getElementById('settingsBackdrop').classList.remove('open');
});
document.getElementById('settingsBackdrop').addEventListener('click', (e) => {
  if (e.target.id === 'settingsBackdrop') e.target.classList.remove('open');
});
document.getElementById('btnExport').addEventListener('click', () => {
  loadPlants(); loadCategories();
  const data = { plants, categories, exportedAt: todayISO() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `piante-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
document.getElementById('btnImportTrigger').addEventListener('click', () => {
  document.getElementById('fImport').click();
});
document.getElementById('fImport').addEventListener('change', () => {
  const file = document.getElementById('fImport').files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data.plants)) throw new Error('formato non valido');
      const merge = plants.length > 0 && !confirm(
        `Hai già ${plants.length} piante salvate. Premi OK per SOSTITUIRLE con quelle importate (${data.plants.length}), o Annulla per aggiungerle a quelle esistenti.`
      );
      loadPlants(); loadCategories();
      if (plants.length === 0 || !merge) {
        plants = data.plants;
      } else {
        plants = plants.concat(data.plants.map(p => ({ ...p, id: p.id + '-imp' })));
      }
      if (Array.isArray(data.categories)) {
        categories = Array.from(new Set([...categories, ...data.categories]));
      }
      savePlants(); saveCategories();
      document.getElementById('settingsBackdrop').classList.remove('open');
      render();
      alert('Importazione completata.');
    } catch (err) {
      alert('File non valido o danneggiato.');
      console.error(err);
    }
  };
  reader.readAsText(file);
  document.getElementById('fImport').value = '';
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((e) => console.log('SW non registrato:', e));
  });
}

render();
checkDueOnOpen();
</script>
</body>
</html>
